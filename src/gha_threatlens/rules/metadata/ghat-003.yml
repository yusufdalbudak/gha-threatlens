id: GHAT-003
title: Untrusted expression in command interpreter
summary: "A potentially untrusted GitHub expression is interpolated directly into a run: script."
category: injection
default_severity: high
applicable: step.run
remediation: >
  Do not interpolate untrusted ${{ }} expressions into run: source. Pass the
  value through env and handle it as data in the selected shell. Quoting inside
  the YAML does not prevent injection because GitHub expands expressions before
  the shell starts. Moving a value to env does not solve every case if the
  variable is later expanded unsafely.
references:
  - title: GitHub Docs — Understanding github context
    url: https://docs.github.com/en/actions/learn-github-actions/contexts#github-context
  - title: GitHub Security Lab — Script injection
    url: https://securitylab.github.com/research/github-actions-untrusted-input/
  - title: GitHub Secure Use Reference — Script injection
    url: https://docs.github.com/en/actions/security-for-github-actions/security-guides/secure-use-reference#script-injection
  - title: CWE-78 OS command injection
    url: https://cwe.mitre.org/data/definitions/78.html
cwe_ids:
  - CWE-78
