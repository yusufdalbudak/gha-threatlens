id: GHAT-001
title: Mutable action reference
summary: Remote GitHub Action or reusable workflow reference is not pinned to a full immutable commit SHA.
category: supply-chain
default_severity: medium
applicable: step.uses
remediation: >
  Verify that the commit belongs to the intended upstream repository and corresponds
  to the expected release, then pin uses: to the full 40-character commit SHA.
  Do not substitute an unverified SHA for a tag. Local paths are ignored. Docker
  image tags are not Git refs; digest pinning is not analysed in v0.1.0.
references:
  - title: GitHub Docs — Using third-party actions
    url: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
  - title: GitHub Secure Use Reference — Pinning
    url: https://docs.github.com/en/actions/security-for-github-actions/security-guides/secure-use-reference#pinning-actions-to-a-full-length-commit-sha
  - title: OpenSSF Scorecard — Pinned-Dependencies
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md#pinned-dependencies
cwe_ids:
  - CWE-829
