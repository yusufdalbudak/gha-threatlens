name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.0
      - uses: actions/setup-python@v5
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
