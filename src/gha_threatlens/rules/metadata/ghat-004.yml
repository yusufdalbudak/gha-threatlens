id: GHAT-004
title: Privileged execution of pull request code
summary: A privileged pull_request_target workflow checks out attacker-controlled pull request code and then executes it.
category: attack-path
default_severity: critical
applicable: workflow + job steps
remediation: >
  Do not check out github.event.pull_request.head.sha (or equivalent) in a
  pull_request_target workflow that has write permissions or secrets. Prefer
  pull_request for untrusted tests, or run untrusted builds in an isolated
  workflow with permissions: {} and no secrets. If a privileged job must
  comment on a pull request, operate only on the trusted base checkout.
references:
  - title: GitHub Docs — Events that trigger workflows (pull_request_target)
    url: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target
  - title: GitHub Security Lab — Preventing pwn requests
    url: https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
  - title: GitHub Secure Use Reference — pull_request_target
    url: https://docs.github.com/en/actions/security-for-github-actions/security-guides/secure-use-reference#pull_request_target
cwe_ids:
  - CWE-829
